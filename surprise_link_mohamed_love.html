<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاجة صغيرة ليك 💙</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#304b73,#101827 65%);font-family:Tahoma,Arial;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(430px,100%);min-height:560px;padding:30px 23px;border-radius:30px;background:#ffffff18;border:1px solid #ffffff30;box-shadow:0 25px 80px #0008;backdrop-filter:blur(14px);text-align:center}.heart{font-size:75px;animation:pulse 1.4s infinite;margin-top:20px}h1{font-size:27px}p{line-height:1.9;color:#e9eef7}input{width:100%;padding:15px;border-radius:16px;border:1px solid #ffffff40;background:#0003;color:white;text-align:center;font-size:17px;margin-top:15px}button{border:0;padding:14px 24px;border-radius:999px;background:white;color:#172943;font-weight:bold;font-size:16px;margin-top:14px;cursor:pointer;width:100%}.err{color:#ffd2d2;min-height:25px;margin-top:8px}.hidden{display:none}.box{margin-top:22px;padding:20px;border-radius:22px;background:#0003;animation:show .5s ease}.final{font-size:17px}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes show{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}</style></head><body><div class="card"><div id="gate"><div class="heart">💙</div><h1>في حاجة صغيرة ليك...</h1><p>بس الدخول مش مفتوح لأي حد 👀<br>لو أنت الشخص المقصود، أكيد هتعرف الباسورد.</p><input id="pass" placeholder="اكتب الباسورد هنا"><button onclick="unlock()">دخول 👀</button><div class="err" id="err"></div></div><div id="game" class="hidden"><div class="heart">💙</div><h1 id="title"></h1><p id="story"></p><div id="choices"></div><div id="box" class="box hidden"></div></div></div><script>const PASSWORD="love";let level=0;const levels=[["المهمة الأولى 🎮","اختار وسيلة الهروب من ضغط اليوم:",["☕ قهوة وهدوء","😂 ضحك وهزار","😴 أنام وأختفي"]],["اختبار مهم جدًا 😂","لو الشغل حاول يكلمك دلوقتي؟",["📵 مش سامع","🏃‍♂️ أجري","😂 أرد وبعدين أندم"]],["آخر مرحلة 👀","دلوقتي اختار مكافأتك:",["🌙 روَقان","🎉 ضحكة","💙 مفاجأة"]]];function unlock(){if(document.getElementById("pass").value.trim().toLowerCase()===PASSWORD){gate.classList.add("hidden");game.classList.remove("hidden");render()}else err.textContent="قريبة… بس مش دي 😂 جرّب تاني."}function render(){let l=levels[level];title.textContent=l[0];story.textContent=l[1];choices.innerHTML="";box.classList.add("hidden");l[2].forEach(x=>{let b=document.createElement("button");b.textContent=x;b.onclick=pick;choices.appendChild(b)})}function pick(){box.classList.remove("hidden");box.textContent=level<2?"اختيار محترم جدًا… واضح إنك محتاج تفصل فعلًا 😂":"تمام… كده وصلت للمفاجأة الأخيرة 👀💙";setTimeout(()=>{level++;level<levels.length?render():finish()},900)}function finish(){title.textContent="وصلت للنهاية 💙";story.textContent="";choices.innerHTML="";box.classList.remove("hidden");box.innerHTML='<div class="final">يمكن الصفحة دي بسيطة… بس اتعملت عشان أسرق منك كام دقيقة بعيد عن الشغل والزحمة.<br><br>مش هقدر أشيل عنك ضغط اليوم، بس أقدر أحاول أخلي جزء صغير منه أخف.<br><br>فاعتبر الدقايق دي إجازة صغيرة مخصوص ليك 😂💙<br><br><b>دلوقتي ممنوع التفكير في أي حاجة… غير إنك تبتسم 😌</b></div>'}</script></body></html>
